name: Complete remaining Phase 4 features

on:
  push:
    branches:
      - phase4-complete-offline-time-leave

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: phase4-complete-offline-time-leave
          fetch-depth: 0

      - name: Prepare guarded patcher
        run: python3 tools/fix-phase4-patcher.py

      - name: Apply guarded completion patch
        run: python3 tools/apply-phase4-complete.py

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run check:backend

      - name: Test Phase 4 server helpers
        run: npm run test:phase4-server

      - name: Run frontend tests
        env:
          CI: 'true'
        run: npm run test:ci

      - name: Build production frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Commit validated completion changes
        shell: bash
        run: |
          git config user.name "phase4-finalizer"
          git config user.email "phase4-finalizer@users.noreply.github.com"
          git add server/server.js src/components/ClockInOut.js
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "[phase4-complete] Implement offline sync, NTP verification and leave lifecycle"
          git push origin HEAD:phase4-complete-offline-time-leave
