name: One-time final hardening

on:
  push:
    branches:
      - phase4-final-completion

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[final-hardening]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: phase4-final-completion
          fetch-depth: 0

      - name: Apply guarded final backend hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('server/server.js')
          text = path.read_text(encoding='utf-8')
          original = text

          registration_pattern = re.compile(
              r"// --------------------------------------------------\n// REQUIRE OFFICIAL REGISTRATION PASSWORD\n// --------------------------------------------------\n\nif \(\n  String\(password\) !== 'Office@premier2026'\n\) \{\n\n  return res\.status\(400\)\.json\(\{\n    success: 0,\n    message:\n      'The registration password is incorrect\.'\n  \}\);\n\n\}\n",
              re.M,
          )
          registration_replacement = """// --------------------------------------------------
// REQUIRE A REASONABLY STRONG ACCOUNT PASSWORD
// --------------------------------------------------

if (String(password).length < 8) {

  return res.status(400).json({
    success: 0,
    message:
      'Password must be at least 8 characters long.'
  });

}
"""
          text, count = registration_pattern.subn(registration_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Registration password hardening anchor mismatch: {count}')

          login_pattern = re.compile(
              r"// --------------------------------------------------\n// REQUIRE OFFICIAL PASSWORD\n// --------------------------------------------------\n\nif \(\n  String\(password\) !== 'Office@premier2026'\n\) \{\n\n  return res\.status\(401\)\.json\(\{\n    success: 0,\n    message: 'Invalid email or password\.'\n  \}\);\n\n\}\n",
              re.M,
          )
          login_replacement = """// --------------------------------------------------
// PASSWORD IS VERIFIED AGAINST THIS USER'S STORED HASH
// --------------------------------------------------
// Do not use a repository-wide shared password gate here.
// The bcrypt / legacy-password verification below is the
// authoritative credential check for the selected account.
"""
          text, count = login_pattern.subn(login_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Login shared-password removal anchor mismatch: {count}')

          final_status_anchor = """      const finalStatus =
        normalizedStatus === 'approved'
          ? 'Approved'
          : 'Denied';
"""
          final_status_replacement = final_status_anchor + """

      const leaveStatusChanged =
        String(leaveRequest.status || '')
          .trim()
          .toLowerCase() !==
        finalStatus.toLowerCase();
"""
          if text.count(final_status_anchor) != 1:
              raise SystemExit(f'Leave finalStatus anchor mismatch: {text.count(final_status_anchor)}')
          text = text.replace(final_status_anchor, final_status_replacement, 1)

          notification_block = """try {

  await db.query(
    `
    INSERT INTO notifications (
      user_id,
      notification_type,
      title,
      message,
      is_read
    )
    VALUES (?, ?, ?, ?, 0)
    `,
    [
      leaveRequest.employee_id,
      'leave',
      notificationTitle,
      notificationMessage
    ]
  );

} catch (notificationError) {

  console.error(
    '❌ Leave notification error:',
    notificationError
  );

}
"""
          notification_replacement = """if (leaveStatusChanged) {

  try {

    await db.query(
      `
      INSERT INTO notifications (
        user_id,
        notification_type,
        title,
        message,
        is_read
      )
      VALUES (?, ?, ?, ?, 0)
      `,
      [
        leaveRequest.employee_id,
        'leave',
        notificationTitle,
        notificationMessage
      ]
    );

  } catch (notificationError) {

    console.error(
      '❌ Leave notification error:',
      notificationError
    );

  }

}
"""
          if text.count(notification_block) != 1:
              raise SystemExit(f'Leave notification block mismatch: {text.count(notification_block)}')
          text = text.replace(notification_block, notification_replacement, 1)

          if text == original:
              raise SystemExit('No backend changes were produced.')

          path.write_text(text, encoding='utf-8')
          print('Final backend hardening patch applied.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run check:backend

      - name: Run smoke test
        env:
          CI: 'true'
        run: npm run test:ci

      - name: Build production frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "phase4-finalizer"
          git config user.email "phase4-finalizer@users.noreply.github.com"
          git add server/server.js
          if git diff --cached --quiet; then
            echo "No server changes to commit."
            exit 0
          fi
          git commit -m "[final-hardening] Secure authentication flow and prevent duplicate leave notifications"
          git push origin HEAD:phase4-final-completion
